    <style>
        :root {
            --primary-blue: #1e88e5;
            --light-blue: #bbdefb;
            --dark-blue: #1565c0;
            --white: #ffffff;
            --light-gray: #f5f5f5;
            --text-color: #333333;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: var(--white);
            color: var(--text-color);
            line-height: 1.6;
        }
        
        header {
            background-color: var(--primary-blue);
            color: var(--white);
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .category-section {
            margin-bottom: 2.5rem;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }
        
        .category-header {
            background-color: var(--primary-blue);
            color: var(--white);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .category-title {
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        .toggle-btn {
            background: none;
            border: none;
            color: var(--white);
            cursor: pointer;
            font-size: 1.2rem;
        }
        
        .food-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1rem;
            padding: 1.5rem;
            background-color: var(--light-gray);
        }
        
        .food-item {
            background-color: var(--white);
            border-radius: 6px;
            padding: 1rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .food-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .food-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--dark-blue);
        }
        
        .food-calories {
            color: #666;
            font-size: 0.9rem;
        }
        
        .collapsed .food-grid {
            display: none;
        }
        
        footer {
            background-color: var(--primary-blue);
            color: var(--white);
            text-align: center;
            padding: 1.5rem;
            margin-top: 2rem;
        }
        
        @media (max-width: 768px) {
            .food-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }
        }
        
        @media (max-width: 480px) {
            .food-grid {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .category-title {
                font-size: 1.3rem;
            }
        }
    </style>
</head>

        // Fungsi untuk mengisi data makanan ke grid
        function populateFoodGrid() {
            for (const category in foodData) {
                const grid = document.getElementById(`${category}-grid`);
                grid.innerHTML = '';
                
                foodData[category].forEach(food => {
                    const foodItem = document.createElement('div');
                    foodItem.className = 'food-item';
                    foodItem.innerHTML = `
                        <div class="food-name">${food.name}</div>
                        <div class="food-calories">${food.calories} kkal per 100g</div>
                    `;
                    grid.appendChild(foodItem);
                });
            }
        }

        // Fungsi untuk toggle collapse/expand kategori
        function setupToggleButtons() {
            const toggleButtons = document.querySelectorAll('.toggle-btn');
            
            toggleButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const section = this.closest('.category-section');
                    section.classList.toggle('collapsed');
                    this.textContent = section.classList.contains('collapsed') ? '+' : '-';
                });
            });
        }

        // Inisialisasi saat halaman dimuat
        document.addEventListener('DOMContentLoaded', function() {
            populateFoodGrid();
            setupToggleButtons();
        });
